        if (m.share) el.appendChild(m.share.link ? h('a', { href: m.share.link, target: '_blank', rel: 'noopener noreferrer', class: 'small', text: m.share.text || m.share.link }) : h('span', { class: 'small', text: m.share.text }));
        if (m.reacts.length) el.appendChild(h('span', { class: 'small muted', text: m.reacts.join('   ') }));
        if (!m.text && !m.photos.length && !m.videos.length && !m.audio.length && !m.share) el.appendChild(h('span', { class: 'muted small', text: 'No text (deleted or unsupported item)' }));
        el.appendChild(h('span', { class: 'at', text: m.t ? new Date(m.t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '' }));

      });

    }
    drawThreads(); drawConvo();
  }

  var mediaState = { limit: 90 };
  function viewMedia(root) {
    if (!S.media.length) { root.appendChild(h('div', { class: 'panel' }, h('p', { text: 'No photos or videos were found in the zip. The export may be metadata only, or the media files may be in a separate zip part.' }))); return; }
    var items = S.media.map(function (p) { var c = S.caption[p]; return { p: p, t: c ? c.t : 0 }; }).sort(function (a, b) { return b.t - a.t || (a.p < b.p ? -1 : 1); });
    var box = h('div', { class: 'panel' }, h('h3', { text: num(items.length) + ' files from posts, stories, reels and profile' }));
    var g = h('div', { class: 'gallery' }), more = h('div');
    box.appendChild(g); box.appendChild(more); root.appendChild(box);
    function draw() {
      clear(g); clear(more);
      items.slice(0, mediaState.limit).forEach(function (it) {
        if (VID.test(ext(it.p))) g.appendChild(h('button', { class: 'btn ghost', type: 'button', style: 'aspect-ratio:1', text: 'Video ' + (it.t ? fmtD(it.t) : ''), onclick: function () { openLB(it.p); } }));
        else g.appendChild(thumb(it.p));
      });
      if (items.length > mediaState.limit) more.appendChild(h('button', { class: 'btn ghost', type: 'button', text: 'Show more (' + num(items.length - mediaState.limit) + ' left)', onclick: function () { mediaState.limit += 120; draw(); } }));
    }
    draw();
  }

  var dataState = { path: null, q: '', limit: 100 };
  function viewData(root) {
    if (!S.datasets.length) { root.appendChild(h('div', { class: 'panel' }, h('p', { text: 'No other data files were found.' }))); return; }
    var sets = S.datasets.slice().sort(function (a, b) { return a.label < b.label ? -1 : 1; });
    if (!dataState.path || !sets.some(function (d) { return d.path === dataState.path; })) {
      var pref = sets.filter(function (d) { return /likes|comments|posts|login/i.test(d.path); })[0];
      dataState.path = (pref || sets[0]).path;
    }
    var gs = {};
    sets.forEach(function (d) { (gs[d.group] = gs[d.group] || []).push(d); });
    var sel = h('select', { id: 'dsel', 'aria-label': 'Choose a list', style: 'flex:1 1 280px', onchange: function (e) { dataState.path = e.target.value; dataState.limit = 100; drawRecs(); } },
      Object.keys(gs).sort().map(function (g) { return h('optgroup', { label: pretty(g) }, gs[g].map(function (d) { return h('option', { value: d.path, text: pretty(d.sub) + ' (' + num(d.items.length) + ')' }); })); }));
    sel.value = dataState.path;
    var q = h('input', { type: 'search', id: 'dq', placeholder: 'Search this list', 'aria-label': 'Search this list', value: dataState.q, oninput: function (e) { dataState.q = e.target.value; dataState.limit = 100; drawRecs(); } });
    var out = h('div'), more = h('div');
    root.appendChild(h('div', { class: 'panel' }, h('div', { class: 'tools' }, sel, q), out, more));
    function drawRecs() {
      clear(out); clear(more);
      var ds = sets.filter(function (d) { return d.path === dataState.path; })[0];
      var s = dataState.q.trim().toLowerCase();
      var rows = ds.items.filter(function (it) {
        if (!s) return true;
        if (it._s == null) it._s = (it.title + ' ' + it.fields.map(function (f) { return f[0] + ' ' + f[1]; }).join(' ')).toLowerCase();
        return it._s.indexOf(s) > -1;
      }).sort(function (a, b) { return b.t - a.t; });
      out.appendChild(h('p', { class: 'small muted', text: ds.path + ' · ' + num(rows.length) + ' records' }));
      rows.slice(0, dataState.limit).forEach(function (it) {
        var main = h('div', { class: 'main' });
        if (it.title) main.appendChild(it.href ? h('a', { class: 'ttl', href: it.href, target: '_blank', rel: 'noopener noreferrer', text: it.title }) : h('span', { class: 'ttl', text: it.title }));
        else if (it.href) main.appendChild(h('a', { href: it.href, target: '_blank', rel: 'noopener noreferrer', text: it.href }));
        var vis = it.fields.slice(0, 2), rest = it.fields.slice(2);
        vis.forEach(function (f) { main.appendChild(h('span', { class: 'small' }, h('span', { class: 'muted', text: f[0] + ': ' }), f[1].length > 300 ? f[1].slice(0, 300) + '...' : f[1])); });
        if (rest.length) main.appendChild(h('details', null, h('summary', { text: rest.length + ' more fields' }), h('dl', null, rest.map(function (f) { return [h('dt', { text: f[0] }), h('dd', { text: f[1] })]; }))));
        out.appendChild(h('div', { class: 'rec' }, h('span', { class: 'when', text: fmtDT(it.t) }), main, it.img ? thumb(it.img) : h('span')));
      });
      if (rows.length > dataState.limit) more.appendChild(h('button', { class: 'btn ghost', type: 'button', text: 'Show more (' + num(rows.length - dataState.limit) + ' left)', onclick: function () { dataState.limit += 200; drawRecs(); } }));
    }
    drawRecs();
  }

  var fileState = { q: '', sel: null, limit: 150 };
  function viewFiles(root) {
    var q = h('input', { type: 'search', id: 'fq', placeholder: 'Filter file paths', 'aria-label': 'Filter file paths', value: fileState.q, oninput: function (e) { fileState.q = e.target.value; fileState.limit = 150; drawList(); } });
    var list = h('div', { class: 'files', style: 'max-height:50vh;overflow:auto' }), more = h('div'), pv = h('div');
    root.appendChild(h('div', { class: 'panel' }, h('div', { class: 'tools' }, q), list, more, pv));
    function drawList() {
      clear(list); clear(more); var s = fileState.q.trim().toLowerCase();
      var rows = S.names.filter(function (n) { return !s || n.toLowerCase().indexOf(s) > -1; });
      rows.slice(0, fileState.limit).forEach(function (n) {
        list.appendChild(h('button', { class: 'row', type: 'button', 'aria-pressed': String(n === fileState.sel), onclick: function () { fileState.sel = n; drawList(); preview(n); } }, h('span', { text: n }), h('span', { text: size(S.sizes[n] || 0) })));
      });
      if (rows.length > fileState.limit) more.appendChild(h('button', { class: 'btn ghost', type: 'button', text: 'Show more (' + num(rows.length - fileState.limit) + ' left)', onclick: function () { fileState.limit += 300; drawList(); } }));
      if (!rows.length) list.appendChild(h('p', { class: 'muted', text: 'No files match.' }));
    }
    function preview(n) {
      clear(pv); var e = ext(n);
      var box = h('div', { class: 'viewer', text: 'Loading' }); pv.appendChild(box);
      if (IMG.test(e)) { blobFor(n).then(function (u) { clear(box); if (u) box.appendChild(h('img', { src: u, alt: '' })); }); return; }
      if (VID.test(e) || AUD.test(e)) { clear(box); box.appendChild(h('button', { class: 'btn ghost', type: 'button', text: 'Play', onclick: function () { openLB(n); } })); return; }
      if (/^(json|html?|txt|csv|xml|js|css)$/.test(e)) {
        S.zip.file(n).async('string').then(function (t) {
          if (e === 'json') { try { t = JSON.stringify(JSON.parse(t, function (k, v) { return typeof v === 'string' ? fix(v) : v; }), null, 2); } catch (x) { } }
          box.textContent = t.length > 250000 ? t.slice(0, 250000) + '\n\n... (cut off, file is ' + size(t.length) + ')' : t;
        });
        return;
      }
      box.textContent = 'This file type cannot be shown here.';
    }
    drawList();
  }

  function render() {
    var root = clear($('view'));
    if (!S) return;
    $('tabs').textContent = '';
    var cnt = { people: totals().ppl, messages: S.threadList.length, media: S.media.length, data: S.datasets.length, files: S.names.length };
    VIEWS.forEach(function (v) {
      $('tabs').appendChild(h('button', { class: 'tab', type: 'button', 'aria-current': v[0] === view ? 'page' : false, onclick: function () { view = v[0]; render(); } }, v[1], cnt[v[0]] != null ? h('small', { text: num(cnt[v[0]]) }) : false));
    });
    ({ overview: viewOverview, people: viewPeople, messages: viewMessages, media: viewMedia, data: viewData, files: viewFiles })[view](root);
  }

  /* ---------- loading ---------- */
  function setData(d) {
    S = d; view = 'overview';
    peopleState = { key: 'notback', q: '', sort: 'name', limit: 200 }; msgState = { id: null, q: '', limit: 300 }; mediaState = { limit: 90 }; dataState = { path: null, q: '', limit: 100 }; fileState = { q: '', sel: null, limit: 150 };
    $('banner').hidden = !d.sample;
    $('dropTitle').textContent = d.sample ? 'Choose your export .zip, or drop it here' : 'Showing ' + d.label;
    $('pick').textContent = d.sample ? 'Choose zip file' : 'Open a different zip';
    setStatus(d.sample ? 'Example data loaded' : num(d.names.length) + ' files read');
    render();
  }
  function loadFile(f) {
    setErr(''); setStatus('Opening ' + f.name);
    if (typeof JSZip === 'undefined') { setErr('The zip reader did not load. Check your connection and reload the page.'); return; }
    JSZip.loadAsync(f).then(function (zip) { return ingest(zip, f.name, false); }).then(setData).catch(function () { setStatus(''); setErr('That file could not be opened as a zip. Choose the .zip you downloaded from Instagram. If the export came in several parts, open one at a time.'); });
  }
  $('pick').addEventListener('click', function () { $('zipIn').click(); });
  $('zipIn').addEventListener('change', function (e) { if (e.target.files[0]) loadFile(e.target.files[0]); });
  ['dragover', 'dragenter'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { document.addEventListener(ev, function () { $('drop').classList.remove('over'); }); });
  document.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

  /* ---------- example export ---------- */
  function makeSample() {
    var z = new JSZip(), seed = 11, now = Date.now(), DAY = 864e5;
    function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
    function ago(d) { return now - d * DAY - rnd() * DAY; }
    var names = ['mira.codes', 'dev_anand', 'kavya.r', 'the.lens.club', 'rohit_s', 'neha.bakes', 'trail_notes', 'sana.k', 'arjun.rides', 'film.frames', 'lakshmi.art', 'pixel.pete', 'chai.daily', 'city.eats.blr', 'tech.weekly', 'indie.records', 'daily.sketch', 'coffee.lab'];
    function sl(u, t) { return { title: '', media_list_data: [], string_list_data: [{ href: 'https://www.instagram.com/' + u, value: u, timestamp: Math.floor(t / 1000) }] }; }
    var fol = names.filter(function (_, i) { return i % 3 !== 2; }), fing = names.filter(function (_, i) { return i % 4 !== 1; });
    var base = 'connections/followers_and_following/';
    z.file(base + 'followers_1.json', JSON.stringify(fol.map(function (u) { return sl(u, ago(rnd() * 500)); })));
    z.file(base + 'following.json', JSON.stringify({ relationships_following: fing.map(function (u) { var o = sl(u, ago(rnd() * 500)); o.title = u; o.string_list_data[0].value = undefined; return o; }) }));
    z.file(base + 'close_friends.json', JSON.stringify({ relationships_close_friends: ['mira.codes', 'kavya.r', 'sana.k'].map(function (u) { return sl(u, ago(rnd() * 300)); }) }));
    z.file(base + 'recently_unfollowed_profiles.json', JSON.stringify({ relationships_unfollowed_users: ['old.friend', 'brand.shop'].map(function (u) { return sl(u, ago(rnd() * 120)); }) }));
    z.file('personal_information/personal_information/personal_information.json', JSON.stringify({ profile_user: [{ string_map_data: { Name: { value: 'Demo User' }, Username: { value: 'demo.user' }, Email: { value: 'demo@example.com' }, 'Private Account': { value: 'False' } } }] }));
    var threads = [['mira.codes', 'Mira Codes', 120], ['kavya.r', 'Kavya R', 60], ['Weekend ride group', 'Arjun Rides', 90]];
    var lines = ['See you at 6?', 'Sent you the link', 'Haha that was good', 'Running late, 10 mins', 'Can you share the photos?', 'Done, check your inbox', 'Thanks!', 'Which route are we taking?', 'Sounds good to me'];
    threads.forEach(function (t, ti) {
      var msgs = [];
      for (var i = 0; i < t[2]; i++) { var me = rnd() > 0.5; msgs.push({ sender_name: me ? 'Demo User' : t[1], timestamp_ms: Math.floor(ago(rnd() * 420)), content: lines[Math.floor(rnd() * lines.length)], type: 'Generic' }); }
      msgs.sort(function (a, b) { return b.timestamp_ms - a.timestamp_ms; });
      var parts = [{ name: 'Demo User' }, { name: t[1] }]; if (ti === 2) parts.push({ name: 'Rohit S' });
      z.file('your_instagram_activity/messages/inbox/' + t[0].replace(/\W/g, '_') + '_' + (100 + ti) + '/message_1.json', JSON.stringify({ participants: parts, messages: msgs, title: t[0] === 'Weekend ride group' ? t[0] : t[1] }));
    });
    var likes = []; for (var i = 0; i < 40; i++) likes.push({ title: names[i % names.length], string_list_data: [{ href: 'https://www.instagram.com/p/Cx' + i + 'abc/', value: 'Like', timestamp: Math.floor(ago(rnd() * 400) / 1000) }] });
    z.file('your_instagram_activity/likes/liked_posts.json', JSON.stringify({ likes_media_likes: likes }));
    var cm = []; ['Love this shot!', 'Where is this?', 'Congrats', 'Great work', 'Same here'].forEach(function (c, i) { cm.push({ string_map_data: { Comment: { value: c }, 'Media Owner': { value: names[i] }, Time: { timestamp: Math.floor(ago(rnd() * 300) / 1000) } } }); });
    z.file('your_instagram_activity/comments/post_comments_1.json', JSON.stringify(cm));
    var logins = []; for (var k = 0; k < 6; k++) logins.push({ title: '', string_map_data: { 'IP Address': { value: '203.0.113.' + (10 + k) }, Time: { timestamp: Math.floor(ago(k * 25) / 1000) }, 'User Agent': { value: 'Instagram 340.0 (iPhone14,5; iOS 17_5)' } } });
    z.file('security_and_login_information/login_and_account_creation/login_activity.json', JSON.stringify({ account_history_login_history: logins }));
    var posts = [], cols = ['#0f7f73', '#d9822b', '#5d6bd6', '#c2476b', '#3a8bd1', '#7a9a2f'], caps = ['Sunday ride', 'Morning coffee', 'New sketch', 'Trail views', 'Studio day', 'Street food'];
    cols.forEach(function (c, i) {
      var cv = document.createElement('canvas'); cv.width = cv.height = 240; var x = cv.getContext('2d');
      x.fillStyle = c; x.fillRect(0, 0, 240, 240); x.fillStyle = 'rgba(255,255,255,0.85)'; x.font = '600 26px sans-serif'; x.textAlign = 'center'; x.fillText(caps[i], 120, 126);
      var p = 'your_instagram_activity/media/posts/2026' + (10 - i > 9 ? 10 : '0' + (10 - i)) + '/photo' + i + '.png';
      z.file(p, cv.toDataURL('image/png').split(',')[1], { base64: true });
      posts.push({ media: [{ uri: p, creation_timestamp: Math.floor(ago(i * 40) / 1000), title: caps[i] }] });
    });
    z.file('your_instagram_activity/media/posts_1.json', JSON.stringify(posts));
    return ingest(z, 'example export', true);
  }

  if (typeof JSZip === 'undefined') { setErr('The zip reader did not load. Check your connection and reload the page.'); return; }
  setStatus('Preparing example data');
  makeSample().then(setData).catch(function (e) { setErr('Could not build the example: ' + e.message); });
})();
